<!DOCTYPE html>
<!-- SPDX-License-Identifier: Apache-2.0 -->
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Theama App</title>
<style>
  body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
  fieldset { margin-bottom: 1.25rem; border: 1px solid #ccc; border-radius: 8px; }
  legend { font-weight: 600; padding: 0 .5rem; }
  input, select, button { font-size: 1rem; margin: .25rem 0; }
  input[type=text] { width: 100%; box-sizing: border-box; padding: .4rem; }
  button { padding: .45rem 1.1rem; cursor: pointer; }
  pre { background: #f5f5f5; padding: .75rem; border-radius: 6px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>Theama App</h1>
<p>Film（4K 30s MP4）・ Avatar（實時互動數字人）・ Image（CJK 文生圖）— Apache-2.0 stack</p>

<fieldset>
  <legend>Image — 文生圖</legend>
  <input type="text" id="imgPrompt" placeholder="提示詞（支援繁中文字渲染）" value="夜市霓虹招牌「珍奶五十嵐」">
  <select id="imgMode"><option value="quality">quality (Qwen-Image-2512)</option><option value="fast">fast (Z-Image Turbo)</option></select>
  <button onclick="submitJob('image')">生成圖片</button>
</fieldset>

<fieldset>
  <legend>Film — 影片</legend>
  <input type="text" id="vidPrompt" placeholder="提示詞" value="a cat walking through neon rain">
  <select id="vidRes"><option>720p</option><option>2K</option><option>4K</option></select>
  <select id="vidSec"><option value="5">5s</option><option value="15">15s</option><option value="30">30s</option></select>
  <button onclick="submitJob('video')">生成影片</button>
</fieldset>

<fieldset>
  <legend>Avatar — 互動數字人</legend>
  <input type="text" id="avMsg" placeholder="對 avatar 說一句話" value="你好，揮個手">
  <button id="avBtn" onclick="toggleAvatar()">開啟互動 session</button>
</fieldset>

<pre id="out">就緒。</pre>

<script>
const out = (m) => document.getElementById('out').textContent =
  typeof m === 'string' ? m : JSON.stringify(m, null, 2);

async function submitJob(kind) {
  const body = kind === 'image'
    ? { prompt: imgPrompt.value, mode: imgMode.value }
    : { prompt: vidPrompt.value, resolution: vidRes.value, seconds: +vidSec.value };
  const r = await fetch('/api/' + kind, { method: 'POST',
    headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  const j = await r.json();
  out(j);
  if (j.job_id) poll(j.job_id);
}

async function poll(id) {
  const r = await fetch('/api/jobs/' + id);
  const j = await r.json();
  out(j);
  if (j.status === 'queued' || j.status === 'running') setTimeout(() => poll(id), 800);
}

let avSocket = null;
function toggleAvatar() {
  const btn = document.getElementById('avBtn');
  if (avSocket) { avSocket.close(); avSocket = null; btn.textContent = '開啟互動 session'; out('session 已關閉。'); return; }
  avSocket = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws/avatar');
  avSocket.onmessage = (e) => out(JSON.parse(e.target ? e.data : e.data));
  avSocket.onopen = () => { btn.textContent = '關閉 session'; avSocket.send(avMsg.value); };
  avSocket.onclose = () => { avSocket = null; btn.textContent = '開啟互動 session'; };
}
</script>
</body>
</html>
